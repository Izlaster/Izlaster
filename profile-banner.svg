<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lev Izmailov — AI Engineer</title>
  <desc id="desc">A visual flow from source documents through retrieval and agent tools to cited answers.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172a"/>
      <stop offset="0.58" stop-color="#151c30"/>
      <stop offset="1" stop-color="#18233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset="1" stop-color="#6de2d0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7b73d6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7b73d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c7d2e5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#backdrop)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1055" cy="186" r="255" fill="url(#glow)"/>
  <path d="M0 306C260 270 405 356 650 318S1002 257 1200 303" fill="none" stroke="#8794b0" stroke-opacity="0.12"/>
  <rect x="56" y="72" width="4" height="216" rx="2" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="88" y="129" fill="#f4f6fb" font-size="55" font-weight="650" letter-spacing="-1.8">Lev Izmailov</text>
    <text x="90" y="177" fill="#91e4d7" font-size="23" font-weight="600">AI Engineer</text>
    <text x="90" y="222" fill="#e0e5ef" font-size="20" font-weight="400">Building knowledge systems with LLMs, RAG, and agents.</text>
    <text x="90" y="274" fill="#a9b5cb" font-size="15" font-weight="500" letter-spacing="0.2">Search · source context · useful answers</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M765 180H806M871 180H914M980 180H1023" stroke="#93a4c0" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="785" cy="180" r="3" fill="#91e4d7" stroke="none"/>
    <circle cx="893" cy="180" r="3" fill="#b9a4ff" stroke="none"/>
    <circle cx="1002" cy="180" r="3" fill="#91e4d7" stroke="none"/>

    <rect x="710" y="145" width="53" height="70" rx="8" stroke="#91e4d7" stroke-opacity="0.88" stroke-width="1.6"/>
    <path d="M723 161H749M723 173H749M723 185H741" stroke="#dbe4f1" stroke-opacity="0.8" stroke-width="1.6"/>
    <path d="M748 145V158H763" stroke="#91e4d7" stroke-opacity="0.6" stroke-width="1.3"/>

    <circle cx="839" cy="178" r="24" stroke="#b9a4ff" stroke-width="1.8"/>
    <path d="M856 196L872 212" stroke="#b9a4ff" stroke-width="2.5"/>
    <path d="M828 179C832 170 839 166 848 169" stroke="#d8cdfc" stroke-opacity="0.75" stroke-width="1.5"/>

    <circle cx="948" cy="180" r="8" fill="url(#accent)" stroke="none"/>
    <circle cx="948" cy="180" r="27" stroke="#91e4d7" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="948" cy="180" r="42" stroke="#b9a4ff" stroke-opacity="0.38" stroke-width="1.2" stroke-dasharray="3 7"/>
    <circle cx="948" cy="138" r="4" fill="#b9a4ff" stroke="none"/>
    <circle cx="921" cy="199" r="4" fill="#91e4d7" stroke="none"/>
    <circle cx="974" cy="202" r="4" fill="#b9a4ff" stroke="none"/>

    <rect x="1029" y="145" width="57" height="70" rx="8" stroke="#91e4d7" stroke-opacity="0.88" stroke-width="1.6"/>
    <path d="M1041 162H1073M1041 174H1067M1041 186H1057" stroke="#dbe4f1" stroke-opacity="0.8" stroke-width="1.6"/>
    <path d="M1063 198L1069 204L1080 191" stroke="#b9a4ff" stroke-width="2.1"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#c7d2e5" font-size="13" text-anchor="middle">
    <text x="736" y="250">documents</text>
    <text x="839" y="250">retrieval</text>
    <text x="948" y="250">agent tools</text>
    <text x="1058" y="250">cited answers</text>
  </g>
</svg>
